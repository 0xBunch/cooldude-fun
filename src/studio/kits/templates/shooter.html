<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<meta name="theme-color" content="#0d0b1f" />
<title>Cool Dudez Game</title>
<!--
  COOL DUDEZ ARCADE — "shooter" kit template.
  Move a hero left/right; it auto-fires upward. Blast descending targets before
  they reach the bottom.

  Injection contract: the assembler replaces the SPEC_JSON placeholder in the
  script below with a base64(UTF-8) blob of the game spec.

  SECURITY: no spec value is ever written as HTML. The spec is decoded here and
  every value is drawn via <canvas> or set via textContent. This template must
  never use innerHTML / eval / Function / document.write with spec-derived data.
-->
<style>
  :root { --bg1:#101a4d; --bg2:#05030f; --accent:#5cff9d; --text:#ffffff; }
  * { box-sizing: border-box; }
  html, body {
    margin:0; height:100%; overflow:hidden;
    background: radial-gradient(130% 130% at 50% 0%, var(--bg1), var(--bg2));
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-user-select: none; user-select: none;
  }
  #wrap { position: fixed; inset: 0; touch-action: none; }
  canvas { display:block; position:absolute; inset:0; }
  #hud {
    position: fixed; top: max(12px, env(safe-area-inset-top)); left: 16px; right: 16px;
    display:flex; justify-content:space-between; align-items:center;
    font-weight: 800; font-size: clamp(16px, 4.6vw, 24px); letter-spacing:.5px;
    pointer-events:none; text-shadow: 0 2px 0 rgba(0,0,0,.45);
  }
  #flash { position: fixed; inset:0; background:#ff2b4d; opacity:0; pointer-events:none; }
  #overlay {
    position: fixed; inset: 0; display:grid; place-items:center; text-align:center;
    padding: 24px; background: rgba(8,8,22,.80);
  }
  #overlay.hide { display:none; }
  .card { max-width: 480px; }
  h1 { font-size: clamp(30px, 9vw, 56px); margin:0 0 10px; line-height:1.04; text-shadow: 0 0 22px var(--accent); }
  #msg { color:#e3e0ff; font-size: clamp(15px, 4.3vw, 20px); margin: 4px 0 24px; }
  button {
    font: inherit; font-weight: 800; font-size: clamp(18px, 5.2vw, 23px);
    padding: 16px 38px; border-radius: 18px; border: 3px solid var(--accent);
    background: transparent; color: var(--text); cursor: pointer;
    box-shadow: 0 0 22px color-mix(in srgb, var(--accent) 55%, transparent);
    -webkit-tap-highlight-color: transparent;
  }
  button:active { transform: scale(.96); }
  .hint { margin-top:16px; color:#a39ed0; font-size:13px; }
</style>
</head>
<body>
<div id="wrap"><canvas id="c"></canvas></div>
<div id="hud"><span id="score"></span><span id="lives"></span></div>
<div id="flash"></div>
<div id="overlay"><div class="card">
  <h1 id="title"></h1>
  <p id="msg"></p>
  <button id="go">Play</button>
  <div class="hint">Move to aim — you fire automatically!</div>
</div></div>
<script>
(function(){
  "use strict";

  var SPEC;
  try {
    SPEC = JSON.parse(new TextDecoder().decode(
      Uint8Array.from(atob("{{SPEC_JSON}}"), function(ch){ return ch.charCodeAt(0); })
    ));
  } catch (e) { SPEC = {}; }
  if (!SPEC || typeof SPEC !== "object") SPEC = {};

  function clamp(v,a,b){ v = Number(v); if(!isFinite(v)) v=a; return v<a?a:(v>b?b:v); }
  function setText(id,s){ document.getElementById(id).textContent = String(s); }

  var T = SPEC.theme || {};
  var rs = document.documentElement.style;
  if (T.bg1)    rs.setProperty("--bg1", String(T.bg1).slice(0,32));
  if (T.bg2)    rs.setProperty("--bg2", String(T.bg2).slice(0,32));
  if (T.accent) rs.setProperty("--accent", String(T.accent).slice(0,32));
  if (T.text)   rs.setProperty("--text", String(T.text).slice(0,32));
  var ACCENT = String(T.accent || "#5cff9d").slice(0,32);

  var TITLE   = String(SPEC.title || "Blaster Game").slice(0,40);
  var GOAL    = String(SPEC.goalText || "Blast the targets before they reach the bottom!").slice(0,120);
  var hero    = (SPEC.hero && SPEC.hero.glyph) ? SPEC.hero : { glyph: "🚀" };
  var targs   = (SPEC.good && SPEC.good.length) ? SPEC.good : [{ glyph:"👾", points:1 }];
  var speed   = clamp(SPEC.speed, 0.5, 2) || 1;
  var maxLives= clamp(Math.floor(SPEC.lives || 3), 1, 5);

  document.title = TITLE;
  setText("title", TITLE);
  setText("msg", GOAL);

  var cv = document.getElementById("c"), ctx = cv.getContext("2d");
  var W, H, DPR = Math.min(2, window.devicePixelRatio || 1);
  var heroX, targetX, heroY, itemR;
  function metrics(){
    itemR = clamp(Math.min(W,H)*0.055, 17, 42);
    heroY = H - clamp(H*0.12, 64, 120);
    if (typeof heroX === "number"){ heroX = clamp(heroX, itemR, W-itemR); targetX = clamp(targetX, itemR, W-itemR); }
  }
  function size(){
    W = innerWidth; H = innerHeight;
    cv.width = W*DPR; cv.height = H*DPR; cv.style.width = W+"px"; cv.style.height = H+"px";
    ctx.setTransform(DPR,0,0,DPR,0,0);
    metrics();
  }
  addEventListener("resize", size); size();

  var AC = null;
  function audio(){ if(!AC){ try{ AC = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } return AC; }
  function blip(f0,f1,dur,type,gain){
    var a = audio(); if(!a) return;
    var o = a.createOscillator(), g = a.createGain();
    o.type = type || "sine";
    o.frequency.setValueAtTime(f0, a.currentTime);
    o.frequency.exponentialRampToValueAtTime(f1, a.currentTime+dur);
    g.gain.setValueAtTime(gain==null?0.18:gain, a.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, a.currentTime+dur);
    o.connect(g); g.connect(a.destination); o.start(); o.stop(a.currentTime+dur);
  }

  var targets, shots, parts, pops, score, lives, playing, last, elapsed, spawnAt, fireAt, shake, flash;
  function reset(){
    metrics();
    targets=[]; shots=[]; parts=[]; pops=[]; score=0; lives=maxLives; elapsed=0; spawnAt=0.5; fireAt=0;
    heroX=W/2; targetX=W/2; shake=0; flash=0; last=0; updateHud();
  }
  function pick(a){ return a[(Math.random()*a.length)|0]; }
  function spawnTarget(){
    var def = pick(targs);
    targets.push({ x: itemR + Math.random()*(W-itemR*2), y: -itemR, vy: (70 + elapsed*5) * speed, glyph: String((def && def.glyph) || "👾"), pts: clamp((def && def.points) || 1, 1, 9), dead:false });
  }
  function burst(x,y,color,n){ for(var i=0;i<n;i++){ var a=Math.random()*6.283, s=60+Math.random()*180; parts.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,age:0,life:.45+Math.random()*.35,color:color}); } }
  function pop(x,y,txt,color){ pops.push({x:x,y:y,txt:txt,color:color,age:0,life:.8}); }
  function updateHud(){
    setText("score", "SCORE " + score);
    var s=""; for(var i=0;i<maxLives;i++) s += (i<lives ? "❤️" : "🤍");
    setText("lives", s);
  }
  function drawGlyph(g,x,y,r){ ctx.font = (r*2)+"px serif"; ctx.textAlign="center"; ctx.textBaseline="middle"; ctx.fillText(g,x,y); }

  function frame(t){
    if(!playing) return;
    var dt = Math.min(0.045, last ? (t-last)/1000 : 0); last=t; elapsed+=dt;

    heroX += (targetX - heroX) * Math.min(1, dt*14);
    heroX = clamp(heroX, itemR, W-itemR);

    // auto-fire
    fireAt -= dt;
    if(fireAt<=0){ shots.push({ x:heroX, y:heroY-itemR, vy:-680 }); fireAt = 0.26; blip(900,1300,.05,"square",0.05); }

    // spawn targets
    spawnAt -= dt;
    var every = Math.max(0.45, 1.15 - elapsed*0.02) / speed;
    if(spawnAt<=0){ spawnTarget(); spawnAt = every; }

    // shots up
    for(var s=shots.length-1;s>=0;s--){ var sh=shots[s]; sh.y += sh.vy*dt; if(sh.y < -12){ shots.splice(s,1); } }

    // targets down + collision + bottom
    for(var i=targets.length-1;i>=0;i--){
      var tg=targets[i]; tg.y += tg.vy*dt;
      var killed=false;
      for(var s2=shots.length-1;s2>=0;s2--){
        var sh2=shots[s2], dx=sh2.x-tg.x, dy=sh2.y-tg.y;
        if(dx*dx+dy*dy <= (itemR+8)*(itemR+8)){
          shots.splice(s2,1); killed=true; break;
        }
      }
      if(killed){
        targets.splice(i,1); score+=tg.pts; blip(680,1020,.12,"sine");
        burst(tg.x,tg.y,ACCENT,12); pop(tg.x,tg.y,"+"+tg.pts,ACCENT); updateHud(); continue;
      }
      if(tg.y - itemR > H){
        targets.splice(i,1); lives--; flash=1; shake=13; blip(300,90,.22,"square");
        updateHud(); if(lives<=0){ return end(); }
      }
    }

    for(var p=parts.length-1;p>=0;p--){ var q=parts[p]; q.age+=dt; if(q.age>=q.life){ parts.splice(p,1); continue; } q.x+=q.vx*dt; q.y+=q.vy*dt; }
    for(var k=pops.length-1;k>=0;k--){ var pp=pops[k]; pp.age+=dt; pp.y-=42*dt; if(pp.age>=pp.life) pops.splice(k,1); }

    if(shake>0) shake=Math.max(0, shake-dt*40);
    if(flash>0){ flash=Math.max(0, flash-dt*2.6); document.getElementById("flash").style.opacity = flash*0.5; }

    render();
    requestAnimationFrame(frame);
  }

  function render(){
    ctx.clearRect(0,0,W,H);
    ctx.save();
    if(shake>0) ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);

    for(var i=0;i<targets.length;i++){ drawGlyph(targets[i].glyph, targets[i].x, targets[i].y, itemR); }

    // shots (glowing bolts)
    ctx.save(); ctx.fillStyle=ACCENT; ctx.shadowColor=ACCENT; ctx.shadowBlur=12;
    for(var s=0;s<shots.length;s++){ ctx.beginPath(); ctx.ellipse(shots[s].x, shots[s].y, 4, 11, 0, 0, 6.283); ctx.fill(); }
    ctx.restore();

    for(var p=0;p<parts.length;p++){ var q=parts[p]; ctx.globalAlpha=Math.max(0,1-q.age/q.life); ctx.fillStyle=q.color; ctx.beginPath(); ctx.arc(q.x,q.y,4,0,6.283); ctx.fill(); }
    ctx.globalAlpha=1;

    ctx.save(); ctx.shadowColor=ACCENT; ctx.shadowBlur=18; drawGlyph(String(hero.glyph||"🚀"), heroX, heroY, itemR*1.3); ctx.restore();

    for(var m=0;m<pops.length;m++){ var pp=pops[m]; ctx.globalAlpha=Math.max(0,1-pp.age/pp.life); ctx.fillStyle=pp.color; ctx.font="800 "+Math.round(itemR*1.05)+"px system-ui,sans-serif"; ctx.textAlign="center"; ctx.textBaseline="middle"; ctx.fillText(pp.txt, pp.x, pp.y); }
    ctx.globalAlpha=1;
    ctx.restore();
  }

  function moveTo(clientX){ var r=cv.getBoundingClientRect(); targetX = clamp(clientX - r.left, 0, W); }
  cv.addEventListener("pointermove", function(e){ if(playing){ e.preventDefault(); moveTo(e.clientX); } }, {passive:false});
  cv.addEventListener("pointerdown", function(e){ if(playing){ e.preventDefault(); moveTo(e.clientX); } }, {passive:false});

  function start(){ audio(); reset(); playing=true; document.getElementById("overlay").classList.add("hide"); requestAnimationFrame(frame); }
  function end(){
    playing=false;
    document.getElementById("overlay").classList.remove("hide");
    var who = (window.Arcade && window.Arcade.nickname) ? (window.Arcade.nickname + ", y") : "Y";
    setText("title", TITLE);
    setText("msg", who + "ou blasted " + score + "!");
    document.getElementById("go").textContent = "Play again";
    setText("score",""); setText("lives","");
    document.getElementById("flash").style.opacity = 0;
    if (window.Arcade && window.Arcade.submitScore) window.Arcade.submitScore(score);
  }
  document.getElementById("go").addEventListener("click", start);

  if (window.Arcade && window.Arcade.ready) window.Arcade.ready(function(){
    if (window.Arcade.nickname) setText("msg", "Hi " + window.Arcade.nickname + "! " + GOAL);
  });
})();
</script>
</body>
</html>
